name: Threads 自動投稿 (JP)

# JLPT語彙アカウントへ 1日3回投稿する(既定 n3→n2→n1 ローテーション)。
# 投稿時刻: 07:00 / 12:00 / 20:00 JST(= UTC 22:00 / 03:00 / 11:00)
# トークンとカーソルは Gist に保存し、期限が近づくと自動でリフレッシュする。
#
# 注意: これは「準備」段階のワークフロー。english-learner の日本語アカ投稿を
# 停止して本番稼働に切り替えるまでは、下記 schedule をコメントアウトしたまま
# にしておく(workflow_dispatch で手動テストのみ可能)。

on:
  # schedule:
  #   - cron: "0 22 * * *"  # 07:00 JST
  #   - cron: "0 3 * * *"   # 12:00 JST
  #   - cron: "0 11 * * *"  # 20:00 JST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 なら実投稿せず内容だけ表示"
        required: false
        default: "1"
      accounts:
        description: '対象を限定(例: "jp")。空なら全部'
        required: false
        default: ""

concurrency:
  group: threads-autopost-jp
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 投稿
        env:
          GH_GIST_TOKEN: ${{ secrets.GH_GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          ACCOUNTS: ${{ github.event.inputs.accounts }}
          PYTHONIOENCODING: "utf-8"
        run: python scripts/auto_post.py
